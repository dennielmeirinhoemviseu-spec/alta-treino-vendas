name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          mkdir -p project
          unzip -q ALTA_Treino_Vendas_Android_Gazin_EVOLUIDO.zip -d project

      - name: Localizar projeto Android
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Encontrar APK
        run: |
          APK=$(find "$PROJECT_DIR" -name "app-debug.apk" -print -quit)
          echo "APK encontrado: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALTA-Treino-Vendas-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
